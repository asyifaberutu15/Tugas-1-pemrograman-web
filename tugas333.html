<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tugas 3</title>

<h1>CALCULATOR SEDERHANA</h1>

<style>
  body{font-family: Arial; padding:40px; background:#f5f5f5}
  .box{background:white; border:1px solid black; padding:20px; width:400px}
  input{width:200px; padding:5px; margin:5px; border:1px solid black}
  button{padding:5px 10px; margin:3px; border:1px solid black; cursor:pointer}
  label{display:inline-block; width:150px}
</style>
</head>
<body>

<div class="box">
  <div>
    <label>Input Bilangan 1</label>
    <input type="number" id="bil1" value="9">
  </div>
  <div>
    <label>Input Bilangan 2</label>
    <input type="number" id="bil2" value="3">
  </div>
  <div style="margin-left:155px;">
    <button onclick="hitung('+')">+</button>
    <button onclick="hitung('-')">-</button>
    <button onclick="hitung('x')">x</button>
    <button onclick="hitung('/')">/</button>
  </div>
  <div>
    <label>Output</label>
    <input type="text" id="output" readonly value="3">
  </div>
</div>

<script>
function hitung(op){
  let a = parseFloat(document.getElementById('bil1').value);
  let b = parseFloat(document.getElementById('bil2').value);
  let hasil;

  if(op == '+') hasil = a + b;
  if(op == '-') hasil = a - b;
  if(op == 'x') hasil = a * b;
  if(op == '/') hasil = a / b;

  document.getElementById('output').value = hasil;
}
</script>

</body>
</html>
